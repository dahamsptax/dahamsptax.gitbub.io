<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>접수 목록 | 다함세무법인 송파지점</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --primary:#1a2744;--primary2:#243259;--accent:#2563eb;
  --gold:#b8963e;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-700:#374151;--gray-900:#111827;
  --white:#fff;--r:8px;
  --sh:0 1px 3px rgba(0,0,0,.08);
  --sh-md:0 4px 12px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--gray-50);color:var(--gray-900);min-height:100vh;}

/* 헤더 */
.hdr{background:var(--primary);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;}
.hdr-logo{font-size:16px;font-weight:700;color:#fff;}
.hdr-title{font-size:13px;color:rgba(255,255,255,.7);}

/* 컨테이너 */
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px;}

/* 타이틀 바 */
.title-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.page-title{font-size:18px;font-weight:700;color:var(--gray-900);}
.total-badge{font-size:12px;color:var(--gray-500);background:var(--gray-100);padding:4px 10px;border-radius:20px;}

/* 필터 바 */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r);padding:0 12px;flex:1;min-width:180px;max-width:280px;}
.search-box input{border:none;outline:none;font-size:13px;font-family:'Noto Sans KR',sans-serif;padding:9px 0;width:100%;background:transparent;color:var(--gray-900);}
.search-box input::placeholder{color:var(--gray-400);}
.filter-sel{padding:9px 12px;border:1px solid var(--gray-200);border-radius:var(--r);font-size:13px;font-family:'Noto Sans KR',sans-serif;color:var(--gray-700);background:var(--white);outline:none;cursor:pointer;}
.btn-refresh{padding:9px 16px;background:var(--primary);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.btn-refresh:hover{background:var(--primary2);}

/* 테이블 */
.tbl-wrap{background:var(--white);border-radius:var(--r);border:1px solid var(--gray-200);box-shadow:var(--sh);overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:var(--primary);}
thead th{padding:11px 14px;text-align:left;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--gray-100);transition:background .1s;}
tbody tr:hover{background:#f8faff;}
tbody tr:last-child{border-bottom:none;}
td{padding:10px 14px;vertical-align:middle;}
.td-no{font-size:12px;color:var(--gray-500);white-space:nowrap;}
.td-name{font-weight:600;color:var(--gray-900);}
.td-contact{color:var(--gray-600);font-size:12px;}
.td-date{font-size:12px;color:var(--gray-500);white-space:nowrap;}

/* 상태 셀렉트 */
.status-sel{font-size:11px;padding:4px 6px;border-radius:20px;border:1px solid transparent;font-family:'Noto Sans KR',sans-serif;font-weight:600;cursor:pointer;outline:none;-webkit-appearance:none;text-align:center;}
.s-제출완료{background:#e8f5ee;color:#2d6a4f;border-color:#bbf7d0;}
.s-검토중{background:#fff8e1;color:#b8963e;border-color:#fde68a;}
.s-신고완료{background:#ede7f6;color:#4527a0;border-color:#c4b5fd;}
.s-보류{background:#fce4ec;color:#c62828;border-color:#fca5a5;}

/* 입금 배지 */
.paid-badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
.paid-y{background:#dbeafe;color:#1d4ed8;}
.paid-n{background:#fee2e2;color:#dc2626;}
.paid-sel{font-size:11px;padding:3px 6px;border-radius:20px;border:none;font-family:'Noto Sans KR',sans-serif;font-weight:600;cursor:pointer;outline:none;-webkit-appearance:none;}

/* 상세 버튼 */
.btn-detail{font-size:12px;padding:4px 12px;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:6px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;}
.btn-detail:hover{background:var(--accent);color:#fff;}

/* 페이지네이션 */
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:20px;font-size:13px;}
.pg-btn{padding:6px 14px;border:1px solid var(--gray-200);border-radius:6px;background:var(--white);color:var(--gray-700);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.pg-btn:hover:not(:disabled){background:var(--primary);color:#fff;border-color:var(--primary);}
.pg-btn:disabled{opacity:.4;cursor:not-allowed;}
.pg-info{color:var(--gray-500);}

/* 로딩/빈 상태 */
.loading{text-align:center;padding:60px 20px;color:var(--gray-400);font-size:14px;}
.empty{text-align:center;padding:60px 20px;color:var(--gray-400);}
.empty-icon{font-size:40px;margin-bottom:12px;}

/* 요약 카드 */
.summary-cards{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.scard{flex:1;min-width:120px;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r);padding:14px 18px;box-shadow:var(--sh);}
.scard-label{font-size:11px;color:var(--gray-500);margin-bottom:4px;}
.scard-val{font-size:22px;font-weight:700;color:var(--gray-900);}
.scard-sub{font-size:11px;color:var(--gray-400);margin-top:2px;}
.scard.accent .scard-val{color:var(--accent);}
.scard.green .scard-val{color:#16a34a;}
.scard.red .scard-val{color:#dc2626;}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--white);border-radius:12px;width:92%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:var(--sh-md);}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:15px;font-weight:700;}
.modal-close{border:none;background:none;font-size:20px;cursor:pointer;color:var(--gray-400);line-height:1;}
.modal-body{padding:20px;}
.modal-row{display:flex;padding:8px 0;border-bottom:1px solid var(--gray-100);font-size:13px;}
.modal-row:last-child{border-bottom:none;}
.modal-key{width:110px;flex-shrink:0;color:var(--gray-500);}
.modal-val{color:var(--gray-900);font-weight:500;flex:1;word-break:break-all;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--gray-100);display:flex;gap:8px;justify-content:flex-end;}
.btn-folder{padding:10px 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
.btn-modal-close{padding:10px 18px;background:var(--gray-100);color:var(--gray-700);border:none;border-radius:var(--r);font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}

@media(max-width:700px){
  thead th:nth-child(3),td:nth-child(3){display:none;}
  .summary-cards{gap:8px;}
  .scard{min-width:90px;padding:10px 12px;}
  .scard-val{font-size:18px;}
}
</style>
</head>
<body>

<!-- ★ Apps Script 배포 URL ★ -->
<script>
const APPS_SCRIPT_URL = "여기에_앱스스크립트_URL_붙여넣기";
</script>

<div class="hdr">
  <div class="hdr-logo">다함세무법인 송파지점</div>
  <div class="hdr-title">관리자 페이지</div>
</div>

<div class="wrap">
  <div class="title-bar">
    <div class="page-title">접수 목록</div>
    <div class="total-badge" id="total-badge">전체 0건</div>
  </div>

  <!-- 요약 카드 -->
  <div class="summary-cards">
    <div class="scard accent"><div class="scard-label">전체 접수</div><div class="scard-val" id="sc-total">0</div></div>
    <div class="scard"><div class="scard-label">제출완료</div><div class="scard-val" id="sc-submit">0</div></div>
    <div class="scard"><div class="scard-label">검토중</div><div class="scard-val" id="sc-review">0</div></div>
    <div class="scard green"><div class="scard-label">신고완료</div><div class="scard-val" id="sc-done">0</div></div>
    <div class="scard red"><div class="scard-label">미입금</div><div class="scard-val" id="sc-unpaid">0</div></div>
  </div>

  <!-- 필터 바 -->
  <div class="filter-bar">
    <div class="search-box">
      <span style="color:var(--gray-400);font-size:14px;">🔍</span>
      <input type="text" id="search-input" placeholder="이름 또는 휴대폰 검색"/>
    </div>
    <select class="filter-sel" id="filter-status">
      <option value="">전체 상태</option>
      <option value="제출완료">제출완료</option>
      <option value="검토중">검토중</option>
      <option value="신고완료">신고완료</option>
      <option value="보류">보류</option>
    </select>
    <select class="filter-sel" id="filter-paid">
      <option value="">입금 전체</option>
      <option value="확인">확인</option>
      <option value="미확인">미확인</option>
    </select>
    <button class="btn-refresh" onclick="loadData()">🔄 새로고침</button>
  </div>

  <!-- 테이블 -->
  <div class="tbl-wrap">
    <table id="main-table">
      <thead>
        <tr>
          <th>접수번호</th>
          <th>이름</th>
          <th>연락처</th>
          <th>상태</th>
          <th>입금</th>
          <th>접수일</th>
          <th>상세</th>
        </tr>
      </thead>
      <tbody id="tbl-body">
        <tr><td colspan="7" class="loading">⏳ 데이터를 불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 페이지네이션 -->
  <div class="pagination">
    <button class="pg-btn" id="pg-prev" onclick="changePage(-1)" disabled>이전</button>
    <span class="pg-info" id="pg-info">1 / 1</span>
    <button class="pg-btn" id="pg-next" onclick="changePage(1)" disabled>다음</button>
  </div>
</div>

<!-- 상세 모달 -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">접수 상세</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn-modal-close" onclick="closeModal()">닫기</button>
      <button class="btn-folder" id="btn-folder" onclick="openFolder()">📂 폴더 열기</button>
    </div>
  </div>
</div>

<script>
const PAGE_SIZE = 20;
let allRows = [];
let filtered = [];
let currentPage = 1;
let currentFolderUrl = '';

const STATUS_LIST = ['제출완료','검토중','신고완료','보류'];
const PAID_LIST   = ['미확인','확인'];

// ── 데이터 로드 ──
async function loadData() {
  document.getElementById('tbl-body').innerHTML = '<tr><td colspan="7" class="loading">⏳ 데이터를 불러오는 중...</td></tr>';
  try {
    const url = APPS_SCRIPT_URL + '?action=list';
    const res = await fetch(url);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '오류');
    allRows = json.rows || [];
    applyFilter();
    updateSummary();
  } catch(err) {
    document.getElementById('tbl-body').innerHTML =
      '<tr><td colspan="7" class="loading" style="color:#dc2626;">❌ 불러오기 실패: ' + err.message + '<br><small>APPS_SCRIPT_URL을 확인해 주세요.</small></td></tr>';
  }
}

// ── 필터 적용 ──
function applyFilter() {
  const q      = document.getElementById('search-input').value.trim().toLowerCase();
  const status = document.getElementById('filter-status').value;
  const paid   = document.getElementById('filter-paid').value;

  filtered = allRows.filter(r => {
    const matchQ = !q || r.name.toLowerCase().includes(q) || r.contact.includes(q);
    const matchS = !status || r.status === status;
    const matchP = !paid   || r.paidYn === paid;
    return matchQ && matchS && matchP;
  });

  document.getElementById('total-badge').textContent = '전체 ' + filtered.length + '건';
  currentPage = 1;
  renderTable();
}

// ── 요약 카드 ──
function updateSummary() {
  document.getElementById('sc-total').textContent  = allRows.length;
  document.getElementById('sc-submit').textContent = allRows.filter(r=>r.status==='제출완료').length;
  document.getElementById('sc-review').textContent = allRows.filter(r=>r.status==='검토중').length;
  document.getElementById('sc-done').textContent   = allRows.filter(r=>r.status==='신고완료').length;
  document.getElementById('sc-unpaid').textContent = allRows.filter(r=>r.paidYn==='미확인').length;
}

// ── 테이블 렌더링 ──
function renderTable() {
  const tbody = document.getElementById('tbl-body');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty"><div class="empty-icon">📭</div><div>접수 내역이 없습니다.</div></td></tr>';
    updatePagination(0);
    return;
  }

  const total = Math.ceil(filtered.length / PAGE_SIZE);
  if (currentPage > total) currentPage = total;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = filtered.slice(start, start + PAGE_SIZE);

  tbody.innerHTML = pageRows.map((r, i) => {
    const globalIdx = start + i;
    const statusOpts = STATUS_LIST.map(s =>
      `<option value="${s}"${r.status===s?' selected':''}>${s}</option>`
    ).join('');
    const paidOpts = PAID_LIST.map(p =>
      `<option value="${p}"${r.paidYn===p?' selected':''}>${p}</option>`
    ).join('');
    const sClass = 's-' + (r.status||'제출완료');
    const pClass = r.paidYn==='확인' ? 'paid-y' : 'paid-n';

    return `<tr>
      <td class="td-no">${esc(r.receiptNo)}</td>
      <td>
        <div class="td-name">${esc(r.name)}</div>
        ${r.bizName ? '<div style="font-size:11px;color:var(--gray-400);">'+esc(r.bizName)+'</div>' : ''}
      </td>
      <td class="td-contact">${esc(r.contact)}</td>
      <td>
        <select class="status-sel ${sClass}" data-idx="${globalIdx}" data-row="${r.rowNum}" onchange="updateStatus(this,11)">
          ${statusOpts}
        </select>
      </td>
      <td>
        <select class="paid-sel ${pClass}" data-idx="${globalIdx}" data-row="${r.rowNum}" onchange="updatePaid(this)">
          ${paidOpts}
        </select>
      </td>
      <td class="td-date">${esc(r.receivedDate)}</td>
      <td><button class="btn-detail" onclick="showDetail(${globalIdx})">상세</button></td>
    </tr>`;
  }).join('');

  updatePagination(total);
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 페이지네이션 ──
function updatePagination(total) {
  document.getElementById('pg-info').textContent = currentPage + ' / ' + (total||1);
  document.getElementById('pg-prev').disabled = currentPage <= 1;
  document.getElementById('pg-next').disabled = currentPage >= total;
}
function changePage(dir) {
  currentPage += dir;
  renderTable();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── 상태 변경 ──
async function updateStatus(sel, col) {
  const idx = +sel.dataset.idx;
  const row = +sel.dataset.row;
  const val = sel.value;
  // UI 즉시 업데이트
  filtered[idx].status = val;
  allRows.find(r=>r.rowNum===row).status = val;
  sel.className = 'status-sel s-' + val;
  updateSummary();
  // 서버 반영
  await fetch(APPS_SCRIPT_URL + '?action=updateStatus&row='+row+'&col='+col+'&value='+encodeURIComponent(val)).catch(()=>{});
}

async function updatePaid(sel) {
  const idx = +sel.dataset.idx;
  const row = +sel.dataset.row;
  const val = sel.value;
  filtered[idx].paidYn = val;
  allRows.find(r=>r.rowNum===row).paidYn = val;
  sel.className = 'paid-sel ' + (val==='확인' ? 'paid-y' : 'paid-n');
  updateSummary();
  await fetch(APPS_SCRIPT_URL + '?action=updateStatus&row='+row+'&col=12&value='+encodeURIComponent(val)).catch(()=>{});
}

// ── 상세 모달 ──
function showDetail(idx) {
  const r = filtered[idx];
  currentFolderUrl = r.folderUrl || '';
  document.getElementById('modal-title').textContent = '접수 상세 — ' + r.receiptNo;
  document.getElementById('btn-folder').style.display = r.folderUrl ? 'block' : 'none';

  const rows = [
    ['접수번호', r.receiptNo], ['성명', r.name], ['생년월일', r.birth],
    ['연락처', r.contact], ['상호', r.bizName||'-'],
    ['귀속연도', r.taxYear ? r.taxYear+'년' : '-'],
    ['소득유형', r.incomeType||'-'],
    ['첨부파일', r.fileCount+'개'],
    ['상태', r.status], ['입금', r.paidYn],
    ['접수일', r.receivedDate],
    ['메모', r.memo||'-'],
  ];

  document.getElementById('modal-body').innerHTML = rows.map(([k,v]) =>
    `<div class="modal-row"><div class="modal-key">${k}</div><div class="modal-val">${esc(String(v||'-'))}</div></div>`
  ).join('');

  document.getElementById('modal-bg').classList.add('show');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-bg')) return;
  document.getElementById('modal-bg').classList.remove('show');
}

function openFolder() {
  if (currentFolderUrl) window.open(currentFolderUrl, '_blank');
}

// ── 이벤트 바인딩 ──
document.getElementById('search-input').addEventListener('input', applyFilter);
document.getElementById('filter-status').addEventListener('change', applyFilter);
document.getElementById('filter-paid').addEventListener('change', applyFilter);

// ── 초기 로드 ──
window.onload = () => {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('여기에')) {
    document.getElementById('tbl-body').innerHTML =
      '<tr><td colspan="7" class="loading" style="color:#dc2626;">⚠️ APPS_SCRIPT_URL을 설정해 주세요.</td></tr>';
    return;
  }
  loadData();
};
</script>
</body>
</html>
